name: Build Wine-crossover (macOS x86_64)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'patches/**'
      - 'scripts/build_wine.sh'
      - '.github/workflows/build-wine.yml'
      - '.gitmodules'
    tags:
      - 'v*'

jobs:
  build-macsw-wine:
    runs-on: macos-13 # 原生 Intel x86_64 runner，完美匹配 Windows x86/x64 转译架构
    timeout-minutes: 180

    steps:
      - name: Checkout MacSW Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Homebrew Build Dependencies
        run: |
          brew install lld llvm bison flex pkg-config mingw-w64 molten-vk gnutls freetype libpng libjpeg
          BREW_PREFIX="$(brew --prefix)"
          echo "${BREW_PREFIX}/opt/llvm/bin" >> $GITHUB_PATH
          echo "${BREW_PREFIX}/opt/bison/bin" >> $GITHUB_PATH
          echo "${BREW_PREFIX}/opt/flex/bin" >> $GITHUB_PATH

      - name: Verify Tools & Environment
        run: |
          clang --version
          bison --version
          flex --version
          pkg-config --version
          uname -m
          brew --prefix

      - name: Apply Patches & Compile Wine-crossover
        run: |
          ./scripts/build_wine.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-crossover-macsw-x86_64
          path: dist/*.tar.gz
          retention-days: 14

      - name: Publish Release Assets (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
