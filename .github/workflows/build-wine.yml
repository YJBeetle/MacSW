name: Build Wine-crossover (macOS ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'patches/**'
      - 'scripts/build_wine.sh'
      - '.github/workflows/build-wine.yml'
      - '.gitmodules'
    tags:
      - 'v*'

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  build-macsw-wine:
    runs-on: macos-14 # Apple Silicon M1 runner
    timeout-minutes: 180

    steps:
      - name: Checkout MacSW Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Homebrew Build Dependencies
        run: |
          brew install bison flex pkg-config mingw-w64 molten-vk gnutls
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH

      - name: Verify Tools & Environment
        run: |
          clang --version
          bison --version
          flex --version
          pkg-config --version
          uname -m

      - name: Apply Patches & Compile Wine-crossover
        run: |
          ./scripts/build_wine.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-crossover-macsw-arm64
          path: dist/*.tar.gz
          retention-days: 14

      - name: Publish Release Assets (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
