name: Developer ID Direct Distribution (manual)

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful Build & Package run with visible smoke for this exact master commit'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  sign-and-notarize:
    if: >-
      github.repository == 'YJBeetle/MacSW' &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    environment: macsw-release
    timeout-minutes: 60
    concurrency:
      group: macsw-developer-id
      cancel-in-progress: false
    outputs:
      signing_team_id: ${{ steps.distribution.outputs.signing_team_id }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

    steps:
      - name: Checkout the exact signing commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify trusted build and visible smoke and download its exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
          MACSW_BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          python3 scripts/ci/signing-input.py --run-id "$MACSW_BUILD_RUN_ID" \
            --sha "$GITHUB_SHA" --destination "$RUNNER_TEMP/macsw-signing-input"
          mkdir "$RUNNER_TEMP/macsw-signing-app"
          ditto -x -k "$RUNNER_TEMP/macsw-signing-input/app.zip" "$RUNNER_TEMP/macsw-signing-app"
          python3 scripts/sign_app.py inventory --app "$RUNNER_TEMP/macsw-signing-app/MacSW.app"

      - name: Install primitive probe prerequisites
        run: |
          brew install mingw-w64
          sudo softwareupdate --install-rosetta --agree-to-license

      - name: Sign, validate, notarize and staple the staging App
        id: distribution
        env:
          SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID || vars.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          SIGNING_TEAM_ID: ${{ vars.SIGNING_TEAM_ID }}
          SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.NOTARY_ISSUER_ID }}
        run: |
          python3 -B scripts/ci/notarize-app.py \
            --app "$RUNNER_TEMP/macsw-signing-app/MacSW.app" \
            --output "$RUNNER_TEMP/macsw-distribution"
          cp "$RUNNER_TEMP/macsw-signing-input/provenance.json" "$RUNNER_TEMP/macsw-distribution/"
          printf 'signing_team_id=%s\n' "$SIGNING_TEAM_ID" >> "$GITHUB_OUTPUT"

      - name: Generate signed update feed from the final notarized ZIP
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 -B scripts/ci/update-feed.py --output "$RUNNER_TEMP/macsw-distribution"

      - name: Always remove temporary signing credentials
        if: always()
        run: python3 scripts/ci/notarize-app.py --cleanup

      - name: Upload accepted Direct Distribution candidate (not a Release)
        uses: actions/upload-artifact@v7
        with:
          name: MacSW-Developer-ID-candidate
          archive: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/macsw-distribution/MacSW-*-macOS-signed.zip
            ${{ runner.temp }}/macsw-distribution/*.sha256
            ${{ runner.temp }}/macsw-distribution/provenance.json
            ${{ runner.temp }}/macsw-distribution/signing-inventory.json
            ${{ runner.temp }}/macsw-distribution/notary-*.json
            ${{ runner.temp }}/macsw-distribution/appcast.xml
          retention-days: 14

      - name: Upload public signing diagnostics only
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: MacSW-Developer-ID-diagnostics
          archive: true
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/macsw-distribution/signing-inventory.json
            ${{ runner.temp }}/macsw-distribution/notary-*.json
          retention-days: 14

  verify-signed-bootstrap:
    needs: sign-and-notarize
    runs-on: macos-15
    timeout-minutes: 15
    env:
      SIGNING_TEAM_ID: ${{ needs.sign-and-notarize.outputs.signing_team_id }}
    steps:
      - name: Checkout the exact signing commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the accepted signed candidate
        uses: actions/download-artifact@v8
        with:
          name: MacSW-Developer-ID-candidate
          path: ${{ runner.temp }}/macsw-signed-bootstrap-input

      - name: Validate final ZIP and initialize a fresh prefix on macOS 15
        run: |
          if [ "$(uname -m)" = arm64 ]; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          cd "$RUNNER_TEMP/macsw-signed-bootstrap-input"
          shasum -a 256 -c MacSW-*-macOS-signed.zip.sha256
          mkdir "$RUNNER_TEMP/macsw-signed-bootstrap-app"
          ditto -x -k MacSW-*-macOS-signed.zip "$RUNNER_TEMP/macsw-signed-bootstrap-app"
          app="$RUNNER_TEMP/macsw-signed-bootstrap-app/MacSW.app"
          python3 -B "$GITHUB_WORKSPACE/scripts/sign_app.py" verify --app "$app" --team "$SIGNING_TEAM_ID"
          xcrun stapler validate "$app"
          python3 -B "$GITHUB_WORKSPACE/scripts/ci/verify-toolbox-native.py" \
            --app "$app" --bootstrap-only --evidence "$RUNNER_TEMP/macsw-signed-bootstrap-evidence"
          python3 -B "$GITHUB_WORKSPACE/scripts/sign_app.py" verify --app "$app" --team "$SIGNING_TEAM_ID"

      - name: Upload signed bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MacSW-signed-bootstrap-macos-15
          path: ${{ runner.temp }}/macsw-signed-bootstrap-evidence/
          if-no-files-found: ignore
          retention-days: 14
