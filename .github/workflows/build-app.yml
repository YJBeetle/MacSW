name: Build & Package MacSW.app

on:
  workflow_dispatch:
    inputs:
      verify_solidworks:
        description: 'Fresh install and real MacSW Wine/SOLIDWORKS runtime gates'
        type: boolean
        default: false
      runtime_stage:
        description: 'Installation only, or installation plus shared runtime gates'
        type: choice
        options:
          - install
          - full
        default: full
      force_fresh_install:
        description: 'Ignore the clean installed-base cache and exercise installation again'
        type: boolean
        default: false
      media_path:
        description: 'ISO path in the gdrive remote'
        type: string
        default: 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/SolidWorks.2025.SP5.0.Premium.DVD.iso'
      assets_path:
        description: 'Private CI fixtures path in the gdrive remote'
        type: string
        default: 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/crack'
      language:
        description: 'Official language directory, or english for base media'
        type: string
        default: 'chinese-simplified'
  push:
    branches:
      - master
    paths:
      - 'macos/**'
      - 'scripts/**'
      - 'config/**'
      - 'Makefile'
      - 'patches/wine-crossover/**'
      - 'resources/**'
      - '.gitmodules'
      - 'Dependencies/SWCLI'
      - '.github/workflows/build-app.yml'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-package:
    # No PR execution. Private runtime inputs are available only to a trusted
    # manual run of master in this repository, never forks or arbitrary refs.
    if: >-
      github.repository == 'YJBeetle/MacSW' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (!inputs.verify_solidworks ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
    runs-on: macos-14 # Apple Silicon M-series Runner，原生极速编译 Swift 与封包
    timeout-minutes: ${{ inputs.verify_solidworks && 360 || 60 }}
    permissions:
      contents: write # Existing tag release upload; runtime fixtures are never released.
    concurrency:
      group: macsw-${{ inputs.verify_solidworks && 'solidworks-runtime' || github.ref }}
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

    steps:
      - name: Checkout MacSW Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Check runtime prerequisites
        if: inputs.verify_solidworks
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          SW_SERIAL_SOLIDWORKS: ${{ secrets.SW_SERIAL_SOLIDWORKS }}
          MACSW_RUNTIME_STAGE: ${{ inputs.runtime_stage }}
        run: |
          test -n "$RCLONE_CONFIG_B64" || { echo 'Missing RCLONE_CONFIG_B64' >&2; exit 1; }
          test -n "$SW_SERIAL_SOLIDWORKS" || { echo 'Missing SW_SERIAL_SOLIDWORKS' >&2; exit 1; }
          test "$(uname -m)" = arm64
          if test "$MACSW_RUNTIME_STAGE" = full; then
            python3 scripts/ci/verify-runtime.py --check-shared-gates
          fi
          # Only accessed ISO ranges are fetched through the read-only NFS mount.
          # Local bottle is about 8.3 GiB; leave room for VFS blocks and fixtures.
          df -h "$RUNNER_TEMP"
          available_kib="$(df -k "$RUNNER_TEMP" | awk 'END {print $4}')"
          test "$available_kib" -ge 25165824 || { echo 'Runtime gate requires 24 GiB free disk' >&2; exit 1; }

      - name: Load build configuration
        id: build-config
        run: |
          source scripts/lib/config.sh
          echo "wine_runtime_asset=${WINE_RUNTIME_ASSET}" >> "$GITHUB_OUTPUT"
          echo "wine_source_asset=${WINE_SOURCE_ASSET}" >> "$GITHUB_OUTPUT"
          echo "winemac_output_name=${WINEMAC_OUTPUT_NAME}" >> "$GITHUB_OUTPUT"
          echo "mono_patch_release=${MONO_PATCH_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "stdole_package_asset=${STDOLE_PACKAGE_ASSET}" >> "$GITHUB_OUTPUT"
          echo "stdole_output_directory=${STDOLE_OUTPUT_DIRECTORY}" >> "$GITHUB_OUTPUT"
          echo "seven_z_archive_asset=${SEVEN_Z_ARCHIVE_ASSET}" >> "$GITHUB_OUTPUT"
          echo "swcli_python_archive_asset=${SWCLI_PYTHON_ARCHIVE_ASSET}" >> "$GITHUB_OUTPUT"
          echo "swcli_pywin32_wheel_asset=${SWCLI_PYWIN32_WHEEL_ASSET}" >> "$GITHUB_OUTPUT"
          echo "swcli_native_python_archive_asset=${SWCLI_NATIVE_PYTHON_ARCHIVE_ASSET}" >> "$GITHUB_OUTPUT"

      - name: Report build toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache pinned Wine runtime and 7zz
        uses: actions/cache@v4
        with:
          path: |
            dist/${{ steps.build-config.outputs.wine_runtime_asset }}
            dist/${{ steps.build-config.outputs.wine_source_asset }}
            dist/${{ steps.build-config.outputs.winemac_output_name }}
            dist/${{ steps.build-config.outputs.mono_patch_release }}
            dist/${{ steps.build-config.outputs.stdole_package_asset }}
            dist/${{ steps.build-config.outputs.stdole_output_directory }}
            dist/${{ steps.build-config.outputs.seven_z_archive_asset }}
            dist/${{ steps.build-config.outputs.swcli_python_archive_asset }}
            dist/${{ steps.build-config.outputs.swcli_pywin32_wheel_asset }}
            dist/${{ steps.build-config.outputs.swcli_native_python_archive_asset }}
            dist/*.whl
            dist/7zz
          key: macsw-runtime-${{ hashFiles('config/versions.env', 'config/swcli-wheels.tsv', 'scripts/fetch_dependencies.sh', 'scripts/lib/config.sh', 'scripts/build_winemac.sh', 'patches/wine-crossover/**') }}

      - name: Prepare isolated SWCLI test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install ./Dependencies/SWCLI
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Wine build dependency
        run: brew install bison mingw-w64

      - name: Ensure Dist Runtime
        run: |
          mkdir -p dist
          echo "==> 检查 Wine 运行时状态..."
          ls -lh dist/ || true

      - name: Test, build, verify and archive MacSW.app
        run: |
          make ci
          ls -lh build/archive/*.zip

      - name: Upload MacSW App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacSW-macOS-App
          path: |
            build/archive/MacSW-*-macOS.zip
            dist/${{ steps.build-config.outputs.wine_source_asset }}
          retention-days: 14

      - name: Prepare private runtime test bundle
        if: inputs.verify_solidworks
        run: |
          brew install rclone
          sudo softwareupdate --install-rosetta --agree-to-license
          swift build --package-path macos/Bootstrap --scratch-path build/swift \
            --configuration release --product MacSWCI
          binary_dir="$(swift build --package-path macos/Bootstrap --scratch-path build/swift \
            --configuration release --show-bin-path)"
          mkdir -p "$RUNNER_TEMP/MacSW-runtime"
          ditto build/app/MacSW.app "$RUNNER_TEMP/MacSW-runtime/MacSW.app"
          cp "$binary_dir/MacSWCI" "$RUNNER_TEMP/MacSW-runtime/MacSW.app/Contents/MacOS/MacSWCI"
          codesign --force --sign - "$RUNNER_TEMP/MacSW-runtime/MacSW.app/Contents/MacOS/MacSWCI"
          # This is a CLI helper in a private resource bundle, not a signed App
          # distribution. Signing the enclosing bundle rejects its shell launchers.
          codesign --verify --verbose=2 "$RUNNER_TEMP/MacSW-runtime/MacSW.app/Contents/MacOS/MacSWCI"

      - name: Resolve installed base cache identity
        if: inputs.verify_solidworks
        env:
          MACSW_MEDIA_PATH: ${{ inputs.media_path }}
          MACSW_CI_LANGUAGE: ${{ inputs.language }}
          MACSW_INSTALLER_HASH: ${{ hashFiles('macos/Bootstrap/Sources/MacSWCore/**', 'macos/Bootstrap/Sources/MacSWCI/**', 'config/versions.env', 'scripts/ci/bottle-cache.py') }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, platform
          context = {name: os.environ[name] for name in
                     ('MACSW_MEDIA_PATH', 'MACSW_CI_LANGUAGE', 'MACSW_INSTALLER_HASH')}
          context.update(macos=platform.mac_ver()[0], architecture=platform.machine())
          digest = hashlib.sha256(json.dumps(context, sort_keys=True).encode()).hexdigest()
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('MACSW_BASE_CONTEXT=' + digest + '\n')
          PY

      - name: Restore official installed bottle cache
        if: inputs.verify_solidworks && !inputs.force_fresh_install
        id: installed-base
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/MacSW-runtime/base-cache
          key: macsw-installed-base-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MACSW_BASE_CONTEXT }}

      - name: Validate cache and copy into isolated test bottle
        if: inputs.verify_solidworks && steps.installed-base.outputs.cache-hit == 'true'
        run: python3 scripts/ci/bottle-cache.py restore --context "$MACSW_BASE_CONTEXT"

      - name: Download private runtime fixtures
        if: inputs.verify_solidworks
        timeout-minutes: 60
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          MACSW_ASSETS_PATH: ${{ inputs.assets_path }}
        run: bash scripts/ci/fetch-runtime-inputs.sh

      - name: Mount media on demand and install using MacSWCore
        if: inputs.verify_solidworks && steps.installed-base.outputs.cache-hit != 'true'
        timeout-minutes: 120
        env:
          SW_SERIAL_SOLIDWORKS: ${{ secrets.SW_SERIAL_SOLIDWORKS }}
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          MACSW_MEDIA_PATH: ${{ inputs.media_path }}
          MACSW_CI_LANGUAGE: ${{ inputs.language }}
        run: |
          python3 scripts/ci/mount-install.py

      - name: Strip serials and snapshot official installed bottle
        if: inputs.verify_solidworks && !inputs.force_fresh_install && steps.installed-base.outputs.cache-hit != 'true'
        env:
          SW_SERIAL_SOLIDWORKS: ${{ secrets.SW_SERIAL_SOLIDWORKS }}
        run: python3 scripts/ci/bottle-cache.py export --context "$MACSW_BASE_CONTEXT"

      - name: Save only verified official base (before private fixtures)
        if: inputs.verify_solidworks && !inputs.force_fresh_install && steps.installed-base.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/MacSW-runtime/base-cache
          key: macsw-installed-base-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MACSW_BASE_CONTEXT }}

      - name: Prepare temporary licensing and runtime fixtures
        if: inputs.verify_solidworks
        timeout-minutes: 15
        run: |
          export MACSW_CI_ASSETS="$RUNNER_TEMP/MacSW-runtime/private/assets"
          "$RUNNER_TEMP/MacSW-runtime/MacSW.app/Contents/MacOS/MacSWCI" fixtures

      - name: Shared modeling then driving dimensions on one host
        if: inputs.verify_solidworks && inputs.runtime_stage == 'full'
        timeout-minutes: 120
        run: |
          .venv/bin/python scripts/ci/verify-runtime.py \
            --app "$RUNNER_TEMP/MacSW-runtime/MacSW.app" \
            --evidence "$RUNNER_TEMP/MacSW-runtime/evidence"

      - name: Stop isolated runtime test bottle
        if: always() && inputs.verify_solidworks
        timeout-minutes: 4
        run: |
          # Bounded process cleanup, then erase private data even if stopping failed.
          python3 scripts/ci/verify-runtime.py --cleanup-private

      - name: Redact runtime evidence before publication
        if: always() && inputs.verify_solidworks
        id: redact-runtime
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          SW_SERIAL_SOLIDWORKS: ${{ secrets.SW_SERIAL_SOLIDWORKS }}
        run: python3 scripts/ci/redact-evidence.py

      - name: Upload sanitized runtime and installer evidence (no license files)
        if: always() && inputs.verify_solidworks && steps.redact-runtime.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MacSW-SOLIDWORKS-runtime-evidence
          path: |
            ${{ runner.temp }}/MacSW-runtime/evidence/*.json
            ${{ runner.temp }}/MacSW-runtime/evidence/*.log
            ${{ runner.temp }}/MacSW-runtime/evidence/**/*.json
            ${{ runner.temp }}/MacSW-runtime/evidence/**/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Release Assets (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/archive/MacSW-*-macOS.zip
            dist/${{ steps.build-config.outputs.wine_source_asset }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
