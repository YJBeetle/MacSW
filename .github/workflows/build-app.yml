name: Build & Package MacSW.app

on:
  workflow_dispatch:
    inputs:
      verify_solidworks:
        description: 'Install/restore SOLIDWORKS and run the selected runtime tests'
        type: boolean
        default: false
      runtime_stage:
        description: 'Installation only, or installation plus runtime tests'
        type: choice
        options:
          - install
          - full
        default: full
      force_fresh_install:
        description: 'Ignore the clean installed-base cache and exercise installation again'
        type: boolean
        default: false
      runtime_profile:
        description: 'Visible smoke (default), or hidden full diagnostics independent of signing'
        type: choice
        options: [visible-smoke, hidden-full]
        default: visible-smoke
      diagnostic_test_set:
        description: 'Manual hidden-full diagnosis only; selected sets do not count as full acceptance'
        type: choice
        options: [all, drawing-save, drawing-save-as, drawings, drawing-copy-first, drawing-copy-reopen, drawing-reopen-no-inspect, drawing-native-reopen]
        default: all
      diagnostic_visible:
        description: 'Single-set visibility comparison only; requires diagnostic_test_set other than all'
        type: boolean
        default: false
      runtime_renderer:
        description: 'Default hardware-first policy or explicit software-renderer diagnostics'
        type: choice
        options: [auto, software]
        default: auto
      media_path:
        description: 'ISO path in the gdrive remote'
        type: string
        default: 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/SolidWorks.2025.SP5.0.Premium.DVD.iso'
      assets_path:
        description: 'Private CI fixtures path in the gdrive remote'
        type: string
        default: 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/crack'
      language:
        description: 'Official language directory, or english for base media'
        type: string
        default: 'chinese-simplified'
  push:
    tags: ["v*"]
    branches:
      - master
    paths:
      - 'macos/**'
      - 'scripts/**'
      - 'config/**'
      - 'Makefile'
      - 'patches/wine-crossover/**'
      - 'native/mono_ccw_release_probe.cs'
      - 'native/mono_btls_probe.cs'
      - 'native/msxml_schema_namespace_probe.c'
      - 'native/macsw_file_panel.m'
      - 'native/macsw_quicklook.m'
      - 'native/wine_file_panel_probe.c'
      - 'native/wine_write_buffers_probe.c'
      - 'resources/**'
      - '.gitmodules'
      - 'Dependencies/SWCLI'
      - '.github/workflows/build-app.yml'

permissions:
  contents: read

jobs:
  tag-policy:
    name: Validate version tag before private runtime
    if: ${{ github.repository == 'YJBeetle/MacSW' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/ci/tag-policy.py

  checks:
    name: Lightweight checks
    if: >-
      github.repository == 'YJBeetle/MacSW' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout MacSW Repository
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up test Python
        id: test-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Prepare isolated SWCLI test dependencies
        id: test-dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install './Dependencies/SWCLI[mcp]'
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      - name: Run unit tests
        id: unit-tests
        run: make test

      - name: Summarize unit check results
        id: summarize-checks
        if: always()
        continue-on-error: true
        run: |
          source scripts/lib/config.sh
          summary_input="$(mktemp -d "$RUNNER_TEMP/macsw-checks-summary.XXXXXX")"
          python3 Dependencies/SWCLI/scripts/ci/summarize-tests.py \
            --evidence-root "$summary_input" \
            --output-dir "${{ runner.temp }}/MacSW-ci-summary/checks" \
            --host macos-wine \
            --scope "MacSW unit checks" \
            --source-commit "$SWCLI_SOURCE_COMMIT" \
            --client-version "$SWCLI_VERSION" \
            --stage "checkout=${{ steps.checkout.outcome || 'skipped' }}" \
            --stage "python=${{ steps.test-python.outcome || 'skipped' }}" \
            --stage "test-dependencies=${{ steps.test-dependencies.outcome || 'skipped' }}" \
            --stage "unit-tests=${{ steps.unit-tests.outcome || 'skipped' }}" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload unit check summary
        id: upload-checks-summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: MacSW-checks-summary
          archive: true
          path: |
            ${{ runner.temp }}/MacSW-ci-summary/checks/summary.json
            ${{ runner.temp }}/MacSW-ci-summary/checks/summary.md
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build & package
    needs: [checks, tag-policy]
    # Ordinary pushes keep App build/package checks. Private SW inputs require
    # the opt-in runtime job below; PRs never execute it.
    if: >-
      always() && github.repository == 'YJBeetle/MacSW' &&
      needs.checks.result == 'success' &&
      ((github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) ||
       (github.event_name == 'workflow_dispatch' && (!inputs.verify_solidworks || github.ref == 'refs/heads/master')) ||
       (startsWith(github.ref, 'refs/tags/v') && needs.tag-policy.result == 'success'))
    runs-on: macos-15 # Apple Silicon runner
    timeout-minutes: 60
    outputs:
      app_archive: ${{ steps.build-config.outputs.app_archive }}
      app_sha256: ${{ steps.artifact-digests.outputs.app_sha256 }}
      helpers_sha256: ${{ steps.artifact-digests.outputs.helpers_sha256 }}
    concurrency:
      group: macsw-build-${{ github.ref }}-${{ inputs.runtime_profile || 'visible-smoke' }}
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      MACSW_VERIFY_SOLIDWORKS: ${{ ((github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.verify_solidworks) || needs.tag-policy.result == 'success') && 'true' || 'false' }}

    steps:
      - name: Checkout MacSW Repository
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Load build configuration
        id: build-config
        env:
          MACSW_ASSETS_HASH: ${{ hashFiles('config/swcli-wheels.tsv', 'scripts/ci/cache-identity.py', 'scripts/fetch_dependencies.sh', 'scripts/lib/config.sh', 'scripts/build_winemac.sh', 'patches/wine-crossover/**') }}
        run: |
          source scripts/lib/config.sh
          runtime_cache_identity="$(python3 scripts/ci/cache-identity.py assets)"
          echo "runtime_cache_identity=$runtime_cache_identity" >> "$GITHUB_OUTPUT"
          echo "app_archive=build/archive/MacSW-${APP_VERSION}-macOS.zip" >> "$GITHUB_OUTPUT"
          echo "wine_runtime_asset=${WINE_RUNTIME_ASSET}" >> "$GITHUB_OUTPUT"
          echo "wine_source_asset=${WINE_SOURCE_ASSET}" >> "$GITHUB_OUTPUT"
          echo "winemac_output_name=${WINEMAC_OUTPUT_NAME}" >> "$GITHUB_OUTPUT"
          echo "mono_patch_release=${MONO_PATCH_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "mono_source_asset=${MONO_SOURCE_ASSET}" >> "$GITHUB_OUTPUT"
          echo "stdole_package_asset=${STDOLE_PACKAGE_ASSET}" >> "$GITHUB_OUTPUT"
          echo "stdole_output_directory=${STDOLE_OUTPUT_DIRECTORY}" >> "$GITHUB_OUTPUT"
          echo "seven_z_archive_asset=${SEVEN_Z_ARCHIVE_ASSET}" >> "$GITHUB_OUTPUT"
          echo "swcli_python_archive_asset=${SWCLI_PYTHON_ARCHIVE_ASSET}" >> "$GITHUB_OUTPUT"
          echo "swcli_pywin32_wheel_asset=${SWCLI_PYWIN32_WHEEL_ASSET}" >> "$GITHUB_OUTPUT"
          echo "swcli_native_python_archive_asset=${SWCLI_NATIVE_PYTHON_ARCHIVE_ASSET}" >> "$GITHUB_OUTPUT"

      - name: Report build toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache pinned Wine runtime and 7zz
        id: assets-cache
        uses: actions/cache@v6
        with:
          path: |
            dist/${{ steps.build-config.outputs.wine_runtime_asset }}
            dist/${{ steps.build-config.outputs.wine_source_asset }}
            dist/${{ steps.build-config.outputs.winemac_output_name }}
            dist/${{ steps.build-config.outputs.mono_patch_release }}
            dist/${{ steps.build-config.outputs.mono_source_asset }}
            dist/${{ steps.build-config.outputs.stdole_package_asset }}
            dist/${{ steps.build-config.outputs.stdole_output_directory }}
            dist/${{ steps.build-config.outputs.seven_z_archive_asset }}
            dist/${{ steps.build-config.outputs.swcli_python_archive_asset }}
            dist/${{ steps.build-config.outputs.swcli_pywin32_wheel_asset }}
            dist/${{ steps.build-config.outputs.swcli_native_python_archive_asset }}
            dist/*.whl
            dist/7zz
          key: macsw-runtime-assets-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-config.outputs.runtime_cache_identity }}

      - name: Prepare isolated SWCLI test dependencies
        id: test-dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install ./Dependencies/SWCLI
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Wine build dependency
        id: build-dependencies
        run: brew install bison mingw-w64

      - name: Ensure Dist Runtime
        id: dist-runtime
        run: |
          mkdir -p dist
          echo "==> 检查 Wine 运行时状态..."
          ls -lh dist/ || true

      - name: Build, verify and archive MacSW.app
        id: archive-app
        run: |
          make archive
          ls -lh build/archive/*.zip

      - name: Verify packaged Toolbox runtime primitives
        id: toolbox-primitives
        # A fresh prefix; separate from shared real SW/CAD gates below.
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license
          python3 scripts/ci/verify-toolbox-native.py \
            --app build/app/MacSW.app --evidence build/toolbox-native-evidence

      - name: Upload MacSW App Artifact
        id: upload-app
        uses: actions/upload-artifact@v7
        with:
          name: MacSW-macOS-App
          archive: true
          path: |
            build/archive/MacSW-*-macOS.zip
            dist/${{ steps.build-config.outputs.wine_source_asset }}
            dist/${{ steps.build-config.outputs.mono_source_asset }}
          retention-days: 14

      - name: Verify concurrent Wine process write-buffer barriers
        id: write-buffers
        run: |
          python3 scripts/diagnostics/verify_write_buffers.py \
            --app build/app/MacSW.app --evidence build/write-buffers-evidence

      - name: Upload process write-buffer barrier evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MacSW-write-buffers
          archive: true
          path: build/write-buffers-evidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify packaged native file dialog bridge
        id: native-file-panels
        run: |
          bash scripts/test_native_file_panel_filters.sh
          python3 scripts/diagnostics/verify_native_file_panels.py \
            --app build/app/MacSW.app --evidence build/native-file-panel-evidence

      - name: Upload native file dialog evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MacSW-native-file-panels
          archive: true
          path: build/native-file-panel-evidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Build and archive CI-only helpers
        id: ci-helpers
        if: env.MACSW_VERIFY_SOLIDWORKS == 'true'
        run: |
          swift build --package-path macos/Bootstrap --scratch-path build/swift \
            --configuration release --product MacSWCI
          swift build --package-path macos/Bootstrap --scratch-path build/swift \
            --configuration release --product MacSWCIRuntime
          binary_dir="$(swift build --package-path macos/Bootstrap --scratch-path build/swift \
            --configuration release --show-bin-path)"
          mkdir -p build/ci
          x86_64-w64-mingw32-gcc -std=c99 -Wall -Wextra -Werror \
            scripts/diagnostics/check_bitmap_opengl.c -lopengl32 -lgdi32 \
            -o build/ci/check_bitmap_opengl.exe
          for architecture in arm64 x86_64; do
            clang -arch "$architecture" -std=c99 -Wall -Wextra -Werror -Wno-deprecated-declarations \
              scripts/diagnostics/check_cgl_renderer.c -framework OpenGL -framework ApplicationServices \
              -o "build/ci/check_cgl_$architecture"
          done
          # tar preserves executable permissions across the artifact service.
          tar -czf build/ci/MacSW-CI-Helpers.tar.gz -C "$binary_dir" MacSWCI MacSWCIRuntime \
            -C "$GITHUB_WORKSPACE/build/ci" check_bitmap_opengl.exe check_cgl_arm64 check_cgl_x86_64

      - name: Record build artifact checksums
        id: artifact-digests
        env:
          MACSW_APP_ARCHIVE: ${{ steps.build-config.outputs.app_archive }}
        run: |
          echo "app_sha256=$(shasum -a 256 "$MACSW_APP_ARCHIVE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          if test "$MACSW_VERIFY_SOLIDWORKS" = true; then
            echo "helpers_sha256=$(shasum -a 256 build/ci/MacSW-CI-Helpers.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload CI-only helper artifact (no runtime fixtures)
        if: env.MACSW_VERIFY_SOLIDWORKS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MacSW-CI-Helpers
          archive: true
          path: build/ci/MacSW-CI-Helpers.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Summarize build results
        id: summarize-build
        if: always()
        continue-on-error: true
        run: |
          source scripts/lib/config.sh
          summary_input="$(mktemp -d "$RUNNER_TEMP/macsw-build-summary.XXXXXX")"
          # Copy only public probe evidence, not the App, caches or source trees.
          for evidence in build/toolbox-native-evidence build/write-buffers-evidence build/native-file-panel-evidence; do
            if test -d "$evidence"; then
              cp -R "$evidence" "$summary_input/"
            fi
          done
          python3 Dependencies/SWCLI/scripts/ci/summarize-tests.py \
            --evidence-root "$summary_input" \
            --output-dir "${{ runner.temp }}/MacSW-ci-summary/build" \
            --host macos-wine \
            --scope "MacSW App build and packaged Wine probes" \
            --source-commit "$SWCLI_SOURCE_COMMIT" \
            --client-version "$SWCLI_VERSION" \
            --stage "checkout=${{ steps.checkout.outcome || 'skipped' }}" \
            --stage "configuration=${{ steps.build-config.outcome || 'skipped' }}" \
            --stage "toolchain=${{ steps.toolchain.outcome || 'skipped' }}" \
            --stage "assets-cache=${{ steps.assets-cache.outcome || 'skipped' }}" \
            --stage "test-dependencies=${{ steps.test-dependencies.outcome || 'skipped' }}" \
            --stage "build-dependencies=${{ steps.build-dependencies.outcome || 'skipped' }}" \
            --stage "dist-runtime=${{ steps.dist-runtime.outcome || 'skipped' }}" \
            --stage "archive-app=${{ steps.archive-app.outcome || 'skipped' }}" \
            --stage "toolbox-primitives=${{ steps.toolbox-primitives.outcome || 'skipped' }}" \
            --stage "upload-app=${{ steps.upload-app.outcome || 'skipped' }}" \
            --stage "write-buffers=${{ steps.write-buffers.outcome || 'skipped' }}" \
            --stage "native-file-panels=${{ steps.native-file-panels.outcome || 'skipped' }}" \
            --stage "ci-helpers=${{ steps.ci-helpers.outcome || 'skipped' }}" \
            --stage "artifact-digests=${{ steps.artifact-digests.outcome || 'skipped' }}" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload build summary
        id: upload-build-summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: MacSW-build-summary
          archive: true
          path: |
            ${{ runner.temp }}/MacSW-ci-summary/build/summary.json
            ${{ runner.temp }}/MacSW-ci-summary/build/summary.md
          if-no-files-found: ignore
          retention-days: 14

  runtime-test:
    name: SOLIDWORKS installation & runtime (${{ matrix.profile }})
    needs: [build, tag-policy]
    # Only explicit master dispatch or a secret-free validated upstream version tag.
    if: >-
      always() && github.repository == 'YJBeetle/MacSW' && needs.build.result == 'success' &&
      ((github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.verify_solidworks) ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.tag-policy.result == 'success'))
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '["visible-smoke","hidden-full"]' || format('["{0}"]', inputs.runtime_profile || 'visible-smoke')) }}
    runs-on: macos-15
    timeout-minutes: 360
    permissions:
      contents: read
    concurrency:
      group: macsw-solidworks-runtime-${{ matrix.profile }}
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      MACSW_VERIFY_SOLIDWORKS: 'true'

    steps:
      - name: Checkout MacSW Repository
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Check runtime prerequisites
        id: prerequisites
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          SW_SERIAL_SOLIDWORKS: ${{ secrets.SW_SERIAL_SOLIDWORKS }}
          MACSW_RUNTIME_STAGE: ${{ inputs.runtime_stage || 'full' }}
          MACSW_RUNTIME_PROFILE: ${{ matrix.profile }}
        run: |
          test -n "$RCLONE_CONFIG_B64" || { echo 'Missing RCLONE_CONFIG_B64' >&2; exit 1; }
          test -n "$SW_SERIAL_SOLIDWORKS" || { echo 'Missing SW_SERIAL_SOLIDWORKS' >&2; exit 1; }
          test "$(uname -m)" = arm64
          if test "$MACSW_RUNTIME_STAGE" = full; then
            python3 scripts/ci/verify-runtime.py --check-shared-gates --profile "$MACSW_RUNTIME_PROFILE"
          fi
          # Only accessed ISO ranges are fetched through the read-only NFS mount.
          # Local bottle is about 8.3 GiB; leave room for VFS blocks and fixtures.
          df -h "$RUNNER_TEMP"
          available_kib="$(df -k "$RUNNER_TEMP" | awk 'END {print $4}')"
          test "$available_kib" -ge 25165824 || { echo 'Runtime gate requires 24 GiB free disk' >&2; exit 1; }

      - name: Prepare isolated SWCLI test dependencies
        id: test-dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install ./Dependencies/SWCLI
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      # With no run-id/token override, downloads are restricted to this run.
      - name: Download this run's MacSW App artifact
        id: download-app
        uses: actions/download-artifact@v8
        with:
          name: MacSW-macOS-App
          path: ${{ runner.temp }}/MacSW-build-artifacts

      - name: Download this run's CI-only helpers
        id: download-helpers
        uses: actions/download-artifact@v8
        with:
          name: MacSW-CI-Helpers
          path: ${{ runner.temp }}/MacSW-ci-helpers

      - name: Prepare private runtime test bundle from verified build artifacts
        id: prepare-runtime
        env:
          MACSW_APP_ARCHIVE: ${{ needs.build.outputs.app_archive }}
          MACSW_APP_SHA256: ${{ needs.build.outputs.app_sha256 }}
          MACSW_HELPERS_SHA256: ${{ needs.build.outputs.helpers_sha256 }}
        run: |
          brew install rclone
          sudo softwareupdate --install-rosetta --agree-to-license
          archive="$RUNNER_TEMP/MacSW-build-artifacts/$MACSW_APP_ARCHIVE"
          helpers="$RUNNER_TEMP/MacSW-ci-helpers/MacSW-CI-Helpers.tar.gz"
          test -n "$MACSW_APP_SHA256" && test -n "$MACSW_HELPERS_SHA256"
          test "$(shasum -a 256 "$archive" | awk '{print $1}')" = "$MACSW_APP_SHA256"
          test "$(shasum -a 256 "$helpers" | awk '{print $1}')" = "$MACSW_HELPERS_SHA256"
          mkdir -p "$RUNNER_TEMP/MacSW-runtime"
          # Unpack the exact distribution zip; do not rebuild on the test runner.
          ditto -x -k "$archive" "$RUNNER_TEMP/MacSW-runtime"
          test -x "$RUNNER_TEMP/MacSW-runtime/MacSW.app/Contents/MacOS/MacSW"
          tar -xzf "$helpers" -C "$RUNNER_TEMP/MacSW-runtime/MacSW.app/Contents/MacOS"
          test -x "$RUNNER_TEMP/MacSW-runtime/MacSW.app/Contents/MacOS/MacSWCI"
          test -x "$RUNNER_TEMP/MacSW-runtime/MacSW.app/Contents/MacOS/MacSWCIRuntime"
          test -f "$RUNNER_TEMP/MacSW-runtime/MacSW.app/Contents/MacOS/check_bitmap_opengl.exe"
          for architecture in arm64 x86_64; do
            probe="$RUNNER_TEMP/MacSW-runtime/MacSW.app/Contents/MacOS/check_cgl_$architecture"
            test -x "$probe"
            codesign --force --sign - "$probe"
            codesign --verify --verbose=2 "$probe"
          done
          codesign --force --sign - "$RUNNER_TEMP/MacSW-runtime/MacSW.app/Contents/MacOS/MacSWCI"
          codesign --force --sign - "$RUNNER_TEMP/MacSW-runtime/MacSW.app/Contents/MacOS/MacSWCIRuntime"
          # This is a CLI helper in a private resource bundle, not a signed App
          # distribution. Signing the enclosing bundle rejects its shell launchers.
          codesign --verify --verbose=2 "$RUNNER_TEMP/MacSW-runtime/MacSW.app/Contents/MacOS/MacSWCI"
          codesign --verify --verbose=2 "$RUNNER_TEMP/MacSW-runtime/MacSW.app/Contents/MacOS/MacSWCIRuntime"

      - name: Resolve installed base cache identity
        id: cache-identity
        if: env.MACSW_VERIFY_SOLIDWORKS == 'true'
        env:
          MACSW_MEDIA_PATH: ${{ inputs.media_path || 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/SolidWorks.2025.SP5.0.Premium.DVD.iso' }}
          MACSW_CI_LANGUAGE: ${{ inputs.language || 'chinese-simplified' }}
          SW_SERIAL_SOLIDWORKS: ${{ secrets.SW_SERIAL_SOLIDWORKS }}
          # Installation source stays conservative; SWCLI/App release identity
          # is filtered separately because it is redeployed from this run's App.
          MACSW_INSTALLER_HASH: ${{ hashFiles('macos/Bootstrap/Sources/MacSWCore/**', 'macos/Bootstrap/Sources/MacSWCI/**', 'scripts/ci/cache-identity.py', 'scripts/ci/bottle-cache.py', 'scripts/build_winemac.sh', 'patches/wine-crossover/**') }}
        run: |
          base_context="$(python3 scripts/ci/cache-identity.py installed-base)"
          echo "MACSW_BASE_CONTEXT=$base_context" >> "$GITHUB_ENV"

      - name: Restore official installed bottle cache
        if: env.MACSW_VERIFY_SOLIDWORKS == 'true' && !inputs.force_fresh_install
        id: installed-base
        uses: actions/cache/restore@v6
        env:
          # GNU tar otherwise masks archived 0666 files to 0644 for this runner.
          # Preserve the snapshot metadata; do not weaken inventory validation.
          TAR_OPTIONS: --same-permissions
        with:
          path: ${{ runner.temp }}/MacSW-runtime/base-cache
          key: macsw-installed-base-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.MACSW_BASE_CONTEXT }}

      - name: Validate cache and copy into isolated test bottle
        id: restore-base
        if: env.MACSW_VERIFY_SOLIDWORKS == 'true' && steps.installed-base.outputs.cache-hit == 'true'
        run: python3 scripts/ci/restore-base.py --context "$MACSW_BASE_CONTEXT"

      - name: Download private runtime fixtures
        id: runtime-inputs
        if: env.MACSW_VERIFY_SOLIDWORKS == 'true'
        timeout-minutes: 60
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          MACSW_ASSETS_PATH: ${{ inputs.assets_path || 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/crack' }}
        run: bash scripts/ci/fetch-runtime-inputs.sh

      - name: Mount media on demand and install using MacSWCore
        id: install-official
        if: env.MACSW_VERIFY_SOLIDWORKS == 'true' && steps.installed-base.outputs.cache-hit != 'true'
        timeout-minutes: 120
        env:
          SW_SERIAL_SOLIDWORKS: ${{ secrets.SW_SERIAL_SOLIDWORKS }}
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          MACSW_MEDIA_PATH: ${{ inputs.media_path || 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/SolidWorks.2025.SP5.0.Premium.DVD.iso' }}
          MACSW_CI_LANGUAGE: ${{ inputs.language || 'chinese-simplified' }}
        run: |
          python3 scripts/ci/mount-install.py

      - name: Snapshot official installed bottle before private fixtures
        id: snapshot-base
        if: env.MACSW_VERIFY_SOLIDWORKS == 'true' && !inputs.force_fresh_install && steps.installed-base.outputs.cache-hit != 'true'
        run: python3 scripts/ci/bottle-cache.py export --context "$MACSW_BASE_CONTEXT"

      - name: Save only verified official base (before private fixtures)
        id: save-base
        if: env.MACSW_VERIFY_SOLIDWORKS == 'true' && !inputs.force_fresh_install && steps.installed-base.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/MacSW-runtime/base-cache
          key: macsw-installed-base-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.MACSW_BASE_CONTEXT }}

      - name: Prepare temporary licensing and runtime fixtures
        id: prepare-fixtures
        if: env.MACSW_VERIFY_SOLIDWORKS == 'true'
        timeout-minutes: 15
        run: |
          export MACSW_CI_ASSETS="$RUNNER_TEMP/MacSW-runtime/private/assets"
          "$RUNNER_TEMP/MacSW-runtime/MacSW.app/Contents/MacOS/MacSWCI" fixtures

      - name: Lightweight visible SOLIDWORKS smoke
        id: visible-smoke
        if: env.MACSW_VERIFY_SOLIDWORKS == 'true' && (inputs.runtime_stage || 'full') == 'full' && matrix.profile == 'visible-smoke'
        timeout-minutes: 30
        run: |
          .venv/bin/python scripts/ci/verify-runtime.py \
            --app "$RUNNER_TEMP/MacSW-runtime/MacSW.app" \
            --evidence "$RUNNER_TEMP/MacSW-runtime/evidence/${{ matrix.profile }}" \
            --profile visible-smoke \
            --renderer '${{ inputs.runtime_renderer || 'auto' }}'

      # Hidden full is manual for development and mandatory for version-tag releases.
      - name: Hidden SOLIDWORKS verification
        id: hidden-full
        if: env.MACSW_VERIFY_SOLIDWORKS == 'true' && (inputs.runtime_stage || 'full') == 'full' && matrix.profile == 'hidden-full'
        timeout-minutes: 330
        env:
          MACSW_DIAGNOSTIC_SET: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_test_set || 'all' }}
          MACSW_DIAGNOSTIC_VISIBLE: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_visible && 'true' || 'false' }}
        run: |
          diagnostic_args=()
          if test "$MACSW_DIAGNOSTIC_SET" != all; then
            diagnostic_args=(--diagnostic-set "$MACSW_DIAGNOSTIC_SET")
          fi
          if test "$MACSW_DIAGNOSTIC_VISIBLE" = true; then
            if test "$MACSW_DIAGNOSTIC_SET" = all; then
              echo 'Visible comparison requires a selected diagnostic set' >&2
              exit 2
            fi
            diagnostic_args+=(--diagnostic-visible)
          fi
          .venv/bin/python scripts/ci/verify-runtime.py \
            --app "$RUNNER_TEMP/MacSW-runtime/MacSW.app" \
            --evidence "$RUNNER_TEMP/MacSW-runtime/evidence/${{ matrix.profile }}" \
            --profile hidden-full \
            --renderer '${{ inputs.runtime_renderer || 'auto' }}' \
            ${diagnostic_args[@]+"${diagnostic_args[@]}"}

      - name: Stop isolated runtime test bottle
        id: cleanup-runtime
        if: always() && env.MACSW_VERIFY_SOLIDWORKS == 'true'
        timeout-minutes: 4
        run: |
          # Bounded process cleanup, then erase private data even if stopping failed.
          python3 scripts/ci/verify-runtime.py --cleanup-private

      - name: Redact runtime evidence before publication
        if: always() && env.MACSW_VERIFY_SOLIDWORKS == 'true'
        id: redact-runtime
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          SW_SERIAL_SOLIDWORKS: ${{ secrets.SW_SERIAL_SOLIDWORKS }}
        run: python3 scripts/ci/redact-evidence.py

      - name: Upload sanitized runtime and installer evidence (no license files)
        if: always() && env.MACSW_VERIFY_SOLIDWORKS == 'true' && steps.redact-runtime.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: MacSW-SOLIDWORKS-runtime-evidence-${{ matrix.profile }}
          archive: true
          path: |
            ${{ runner.temp }}/MacSW-runtime/evidence/*.json
            ${{ runner.temp }}/MacSW-runtime/evidence/*.log
            ${{ runner.temp }}/MacSW-runtime/evidence/**/*.json
            ${{ runner.temp }}/MacSW-runtime/evidence/**/*.log
            ${{ runner.temp }}/MacSW-runtime/evidence/**/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize runtime results
        id: summarize-runtime
        if: always()
        continue-on-error: true
        env:
          MACSW_REDACTION_OUTCOME: ${{ steps.redact-runtime.outcome }}
          MACSW_SUMMARY_SCOPE: "MacSW runtime: ${{ matrix.profile }}; stage=${{ inputs.runtime_stage || 'full' }}; diagnostic=${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_test_set || 'all' }}"
        run: |
          source scripts/lib/config.sh
          # The redaction barrier is authoritative. Never inspect raw receipts on failure.
          summary_input="$(mktemp -d "$RUNNER_TEMP/macsw-runtime-summary-empty.XXXXXX")"
          if test "$MACSW_REDACTION_OUTCOME" = success; then
            summary_input="$RUNNER_TEMP/MacSW-runtime/evidence"
            mkdir -p "$summary_input"
          fi
          python3 Dependencies/SWCLI/scripts/ci/summarize-tests.py \
            --evidence-root "$summary_input" \
            --output-dir "${{ runner.temp }}/MacSW-ci-summary/runtime/${{ matrix.profile }}" \
            --host macos-wine \
            --scope "$MACSW_SUMMARY_SCOPE" \
            --source-commit "$SWCLI_SOURCE_COMMIT" \
            --client-version "$SWCLI_VERSION" \
            --stage "checkout=${{ steps.checkout.outcome || 'skipped' }}" \
            --stage "prerequisites=${{ steps.prerequisites.outcome || 'skipped' }}" \
            --stage "test-dependencies=${{ steps.test-dependencies.outcome || 'skipped' }}" \
            --stage "download-app=${{ steps.download-app.outcome || 'skipped' }}" \
            --stage "download-helpers=${{ steps.download-helpers.outcome || 'skipped' }}" \
            --stage "prepare-runtime=${{ steps.prepare-runtime.outcome || 'skipped' }}" \
            --stage "cache-identity=${{ steps.cache-identity.outcome || 'skipped' }}" \
            --stage "base-cache-lookup=${{ steps.installed-base.outcome || 'skipped' }}" \
            --stage "restore-base=${{ steps.restore-base.outcome || 'skipped' }}" \
            --stage "runtime-inputs=${{ steps.runtime-inputs.outcome || 'skipped' }}" \
            --stage "install-official=${{ steps.install-official.outcome || 'skipped' }}" \
            --stage "snapshot-base=${{ steps.snapshot-base.outcome || 'skipped' }}" \
            --stage "save-base=${{ steps.save-base.outcome || 'skipped' }}" \
            --stage "prepare-fixtures=${{ steps.prepare-fixtures.outcome || 'skipped' }}" \
            --stage "visible-smoke=${{ steps.visible-smoke.outcome || 'skipped' }}" \
            --stage "hidden-full=${{ steps.hidden-full.outcome || 'skipped' }}" \
            --stage "cleanup=${{ steps.cleanup-runtime.outcome || 'skipped' }}" \
            --stage "redaction=${{ steps.redact-runtime.outcome || 'skipped' }}" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime summary
        id: upload-runtime-summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: MacSW-runtime-summary-${{ matrix.profile }}
          archive: true
          path: |
            ${{ runner.temp }}/MacSW-ci-summary/runtime/${{ matrix.profile }}/summary.json
            ${{ runner.temp }}/MacSW-ci-summary/runtime/${{ matrix.profile }}/summary.md
          if-no-files-found: ignore
          retention-days: 14
